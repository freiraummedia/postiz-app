name: "Xenobase Image"

# Baut das Postiz-Image für social.xenobase.de (nur amd64) bei jedem Push auf xenobase-build.
on:
  push:
    branches: [xenobase-build]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        run: |
          TAG="xenobase-${GITHUB_SHA::7}"
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION="v2.25.3-xenobase" \
            --provenance=false --sbom=false \
            -t ghcr.io/freiraummedia/postiz-app:$TAG \
            -t ghcr.io/freiraummedia/postiz-app:xenobase-latest \
            --push .
          echo "Image: ghcr.io/freiraummedia/postiz-app:$TAG" >> "$GITHUB_STEP_SUMMARY"
